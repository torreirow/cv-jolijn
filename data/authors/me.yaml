bio: |
  Jolijn van der Toorren works as a Public Engagement Officer at
  Museon-Omniversum. She obtained her propaedeutic diploma in International
  Public Policy and Leadership at The Hague University of Applied Sciences
  and aims to start the bachelor's programme
  [Political Science: International Relations and Organisations](https://www.universiteitleiden.nl/en/education/study-programmes/bachelor/political-science/international-relations-and-organisations)
  at Leiden University in the 2027/2028 academic year. She has a strong
  interest in societal issues, public service, and effective communication,
  and leads the worship band at Living Word Church.
  She is currently taking a gap year, during which she continues her work
  at the museum.
